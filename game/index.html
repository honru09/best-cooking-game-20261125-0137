<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Bento Rush</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d1823' stroke='%23cf3e2b' stroke-width='3'/%3E%3Cpolygon points='16,6 25,24 7,24' fill='%23faf6ee'/%3E%3Crect x='11' y='18' width='10' height='6' fill='%23183327'/%3E%3Ccircle cx='16' cy='13' r='2.6' fill='%23eb6742'/%3E%3C/svg%3E" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #100d17;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.72);
    }
    #kitchen-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #191525;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Midnight Bento Rush">
    <canvas id="kitchen-canvas" width="1280" height="720"></canvas>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
